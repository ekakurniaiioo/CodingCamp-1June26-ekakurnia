<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <main class="dashboard">
        <header class="card hero-card">
            <div class="top-actions">
                <input type="text" id="nameInput" placeholder="Enter your name..." />
                <button id="themeToggle">Dark Mode</button>
            </div>

            <h1 id="time">00:00:00</h1>
            <p id="date">Monday, January 1, 2026</p>
            <h2 id="greeting">Good Morning</h2>
        </header>

        <section class="grid" aria-label="Dashboard features">
            <section class="card timer-card">
                <h2>Focus Timer</h2>
                <div id="timer">25:00</div>

                <div class="button-group">
                    <button id="startTimer">Start</button>
                    <button id="stopTimer" class="secondary">Stop</button>
                    <button id="resetTimer" class="secondary">Reset</button>
                </div>
            </section>

            <section class="card tasks-card">
                <h2>Tasks</h2>

                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="Add a new task..." />
                    <button id="addTask">Add</button>
                </div>

                <p id="taskMessage" class="message"></p>
                <ul id="taskList"></ul>
            </section>

            <section class="card links-card">
                <h2>Quick Links</h2>

                <div class="input-group links-input">
                    <input type="text" id="linkNameInput" placeholder="Link name" />
                    <input type="url" id="linkUrlInput" placeholder="URL" />
                    <button id="addLink">Add Link</button>
                </div>

                <div id="quickLinks" class="quick-links"></div>
            </section>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
